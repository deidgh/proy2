<!DOCTYPE html> 
<html> 
    <head> 
        <meta charset="utf-8"> 
        <title>Formularios</title> 
    </head> 
    <body> 
        <h1>Formulario de retroalimentació</h1> 
        <p>Llene este formulario para ayudarnos a mejorar 
            el sitio.</p> 
        <form method="post" action="www.deitel.com"> 
        <input type="hidden" name="destinatario" 
             value="deitel@deitel.com"> 
        <input type="hidden" name="asunto" 
             value="Formulario de retroalimentación"> 
        <input type="hidden" name="destinatario" 
             value="principal.html"> 
             <p><label>Nombre: 
                 <input name="nombre" type="text" size="25" maxlength="30"> 
             </label></p> 
             <input type="submit" value="Enviar"> 
             <input type="Reset" value="Borrar">  
            </p>     
        </form>      
     </body> <!--El elemento <input> en HTML permite crear controles interactivos en formularios para recopilar datos del usuario -->
</html>
