<!DOCTYPE html> 
<html> 
    <head> 
        <meta charset="utf-8"> 
        <title>Tablas</title> 
    </head> 
    <body> 
        <h1>Ejemplo de tabla: combinando de las filas y columnas</h1> 
        <table border="1"> 
            <caption>Una tabla mas compleja de hacer</caption> 
            <thead> 
                <tr> 
                    <th rowspan="2"> 
                        <img src="camello.jpg" width="205" height="167"  
                        alt="Camello"> 
                    </th> 
                    <th colspan="4"> 
                        <strong>Comparación de camelidos</strong><br> 
                        Fecha aproximada: 26/10/2020 
                    </th> 
                </tr> 
                <tr> 
                    <th># Jorobas</th> 
                    <th># Region ígneas</th> 
                    <th># Escupe?</th> 
                    <th># Produce lana?</th> 
                </tr> 
 
            </thead> 
            <tbody> 
                <tr> 
                    <th>Camellos bactrianos</th> 
                    <td>2</td> 
                    <td>Africa/Asia</td> 
                    <td>Si</td> 
                    <td>Si</td> 
                </tr> 
                <tr> 
                    <th>Llamas</th> 
                    <td>1</td> 
                    <td>Montañas de los ándes</td> 
                    <td>Si</td> 
                    <td>Si</td> 
                </tr> 
            </tbody> 
        </table>    
    </body> 
</html>
