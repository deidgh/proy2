<!DOCTYPE html> 
<html> 
    <head> 
        <meta charset="utf-8"> 
        <title>Una tabla en HTML5 Simple</title> 
    </head> 
    <body> 
        <table border="1" > 
            <caption><strong>Tabla de frutas (1era columna) y sus frutas (2d <!-- En HTML, la etiqueta <caption> se utiliza para agregar un título o descripción a una tabla. -->
a columna)</strong></caption> 
        <thead> <!-- etiqueta que se usa para agrupar el contenido de encabezado de una tabla. -->
            <tr> 
                <th>Fruta</th> 
                <th>Precio</th>   
            </tr> 
        </thead> 
        <tfoot> 
            <tr> 
                <th>Total</th> 
                <th>$3.75</th> 
            </tr> 
        </tfoot> 
        <tbody> 
            <tr> 
<td>manzana</td> 
<td>$0.25</td> 
</tr> 
<tr> 
<td>Naranja</td> 
<td>$0.50</td> 
</tr> 
<tr> 
<td>Platano</td> 
<td>$1.00</td> 
</tr> 
<tr> 
<td>Piña</td> <!--El comando <td> en HTML se utiliza para definir una celda de datos en una tabla -->
<td>$2.00</td> 
</tr> 
</tbody> 
</table>     <!--crear tabla --> 
</body> 
</html>
