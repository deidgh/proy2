<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

     <style>

body{
margin: 0px;
padding: 0px;
font-family: Verdana, serif;
}
header {
padding: 30px;
background: #3e3e8a;
color: #FFFFFF;
font-size: 3em;
font-weight: bold;
}
nav{
display: flex; /* Indica a la capa nav que se convierta en
flexbox */
flex-direction: column; /* Se muestra en columna */
background: #CCC;
width: 300px;
}
nav a{
color: #b85050;
text-decoration: none;
padding: 15px;
}
nav a:hover{
background: #814040;
color: #CCCCCC;
}
</style>
</head>
<body>
    <header>Flexbox -Alineado vertical</header>
<nav>
<a href="#">Enlace 1</a>
<a href="#">Enlace 2</a>
<a href="#">Enlace 3</a>
<a href="#">Enlace 4</a>
</nav>
</body>
</html>
