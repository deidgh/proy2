<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>HORA DE AVENTURA</title>
    <style>
        body {
            font-family: Verdana, serif;
            margin: 10px;
            padding: 10px;
            background-color: #f5d6a6;
        }
        .pagina {
            width: 1200px;
            margin: 10px auto;
            padding: 10px;
            background-color: white;
            border: 10px solid #e67e22;
        }
       .banner {
    height: 400px;
    margin: 10px;
    padding: 10px;
    border: 3px solid #444444;
    background-color: #dddddd;
}

.banner img {
    width: 100%;
    height: 400px;
}
        nav {
            margin: 10px;
            padding: 10px;
            background-color: #444444;
            text-align: center;
        }
        nav a {
            display: inline-block;
            width: 200px;
            margin: 10px;
            padding: 15px;
            background-color: #eeeeee;
            color: #333333;
            text-decoration: none;
            border: 3px solid #222222;
        }
        .contenido {
            margin: 10px;
            padding: 10px;
            border: 3px solid #444444;
            background-color: #f2f2f2;
            text-align: center;
        }
        .contenido h2 {
            margin: 10px;
            font-size: 24px;
        }
        .bloque {
            display: inline-block;
            vertical-align: top;
            width: 43%;
            height: 250px;
            margin: 10px;
            padding: 10px;
            border: 3px solid #444444;
            background-color: white;
        }

        .bloque img {
            width: 200px;
            height: 150px;
            margin: 10px;
            border: 3px solid #555555;
        }

        .bloque h3 {
            margin: 10px;
            font-size: 18px;
        }

        .bloque p {
            font-size: 13px;
        }

        #bloque1 {
            background-color: #d9e8f5;
            border-color: #477da8;
        }

        #bloque2 {
            background-color: #f7d6d0;
            border-color: #b84a4a;
        }

        #bloque3 {
            background-color: #f3f5d5;
            border-color: #8f9a50;
        }

        #bloque4 {
            background-color: #d8efd8;
            border-color: #4d8b4d;
        }
        footer {
            margin: 10px;
            padding: 20px;
            border: 3px solid #444444;
            background-color: #dddddd;
            text-align: center;
        }

        footer a {
            display: inline-block;
            margin: 10px;
            padding: 10px;
            background-color: white;
            color: #333333;
            border: 2px solid #444444;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="pagina">
        <div class="banner">

            <img src="fin.jpg">

        </div>
        <nav>

            <a href="#">Inicio</a>

            <a href="#">MENU</a>

            <a href="#">Contacto</a>

        </nav>
        <div class="contenido">
            <h2>PERSONAJES</h2>
            <div class="bloque" id="bloque1">
                <img src="REY.png">
                <h3>REY HELADO</h3>

                <p>
                    ES EL HELADO.
                </p>

            </div>


            <div class="bloque" id="bloque2">

                <img src="GUNTER.jpg">

                <h3>GUNTER</h3>

                <p>
                SE VOLVIO REGUETONERO.
                </p>

            </div>


            <div class="bloque" id="bloque3">

                <img src="JAKE.jpg">
                <h3>JAKE</h3>
                <p>
                    ES UN PERRO.
                </p>
            </div>
            <div class="bloque" id="bloque4">
                <img src="FINN.jpg">
                <h3>FINN</h3>
                <p>
                    EL HUMANO.
                </p>
            </div>
        </div>
        <footer>
            <a href="#">Link</a>
            <a href="#">Informacion</a>
            <a href="#">Sobre nosotros</a>
            <p>
                ES MI PAGINA DE HORA DE AVENTURA.
            </p>
        </footer>
    </div>
</body>
</html>
